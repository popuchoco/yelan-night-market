<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111b1d">
  <meta name="description" content="夜嵐夜市 2.5D 俯視經營模擬：經營攤位、調度人手與備料，在港邊夜色中接待每一位客人。">
  <title>夜嵐夜市 — 2.5D 港邊經營模擬</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">🏮</div><div><div class="brand-name">夜嵐夜市</div><div class="brand-sub">HARBOR NIGHT MARKET · 09</div></div></div>
      <div class="header-divider"></div>
      <div class="night-label"><span>營業進度</span><strong>第 <b id="dayValue">03</b> 個夜晚　·　<em id="phaseLabel">準備中</em></strong></div>
      <div class="header-spacer"></div>
      <div class="save-indicator" aria-live="polite"><i></i><span id="saveLabel">進度已儲存</span></div>
      <div class="resource-row" aria-label="夜市資源">
        <div class="resource"><span class="resource-icon">◉</span><span><small>現金</small><b id="coinsValue">NT$ 1,480</b></span></div>
        <div class="resource"><span class="resource-icon">✳</span><span><small>口碑</small><b id="fameValue">38</b></span></div>
        <div class="resource"><span class="resource-icon">♙</span><span><small>熟客</small><b id="regularValue">08 / 24</b></span></div>
      </div>
    </header>
    <main class="game-layout">
      <section class="world-frame" aria-label="夜嵐夜市 2.5D 斜俯視經營場景">
        <canvas id="worldCanvas" aria-label="可旋轉夜市地圖；點擊中央攤位進入管理，點擊正在接待的客人點餐"></canvas>
        <div class="world-top-left">
          <span class="world-eyebrow">NORTH COAST · DISTRICT 09</span>
          <strong class="world-title">潮聲近了，準備開門嗎？</strong>
          <span class="world-state" id="worldState"><i class="state-dot"></i><span id="worldStateText">備料與排班中</span></span>
        </div>
        <div class="camera-tools" aria-label="3D 相機控制">
          <span class="camera-label" id="cameraLabel">斜俯視 · 北岸</span>
          <button class="icon-button" data-action="orbit-left" aria-label="將相機往左旋轉 45 度">⟲</button>
          <button class="icon-button" data-action="tilt-up" aria-label="相機抬高">⌃</button>
          <button class="icon-button" data-action="tilt-down" aria-label="相機降低">⌄</button>
          <button class="icon-button" data-action="zoom-out" aria-label="縮小">−</button>
          <button class="icon-button" data-action="zoom-in" aria-label="放大">+</button>
          <button class="icon-button" data-action="camera-reset" aria-label="重設相機">◎</button>
          <button class="icon-button" data-action="orbit-right" aria-label="將相機往右旋轉 45 度">⟳</button>
        </div>
        <div class="world-hint"><b>操作：</b>拖曳旋轉視角・滾輪縮放・點擊攤位管理・點擊客人接單</div>
        <div class="world-actions">
          <button class="world-action" data-action="open-stall">⌂ 攤位管理</button>
          <button class="world-action" data-action="toggle-sound" aria-pressed="false">♫ 音效：關</button>
          <button class="world-action" data-action="toggle-pause" aria-pressed="false">Ⅱ 暫停場景</button>
          <button class="world-action primary" id="mainAction" data-action="main-action">掛燈迎客　→</button>
        </div>
      </section>
      <aside class="panel">
        <div class="panel-head">
          <div class="panel-kicker">HARBOR OPERATIONS</div>
          <div class="panel-title-row"><h1 class="panel-title" id="panelHeading">今晚營運</h1><span class="mini-status" id="panelPhase">準備時段</span></div>
        </div>
        <nav class="panel-tabs" aria-label="攤位管理">
          <button class="panel-tab active" data-action="panel-tab" data-tab="ops"><span>◷</span>營運</button>
          <button class="panel-tab" data-action="panel-tab" data-tab="stall"><span>⌂</span>攤位</button>
          <button class="panel-tab" data-action="panel-tab" data-tab="stock"><span>🥬</span>備料</button>
          <button class="panel-tab" data-action="panel-tab" data-tab="equipment"><span>⚒</span>設備</button>
          <button class="panel-tab" data-action="panel-tab" data-tab="staff"><span>♙</span>排班</button>
          <button class="panel-tab" data-action="panel-tab" data-tab="journal"><span>▤</span>手記</button>
        </nav>
        <div class="panel-content" id="panelContent"></div>
      </aside>
    </main>
  </div>
  <div class="modal-backdrop" id="orderModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="orderTitle">
      <div class="modal-head"><div><div class="modal-kicker" id="orderKicker">CUSTOMER AT THE COUNTER</div><h2 class="modal-title" id="orderTitle">今晚的客人</h2><div class="modal-desc" id="orderMeta"></div></div><button class="close-button" data-action="close-order" aria-label="關閉點餐">×</button></div>
      <div class="order-quote" id="orderQuote"></div>
      <div id="orderChoices"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" type="module"></script>
</body>
</html>
